# Production: the new app at the site root, the previous app kept at /legacy/ as a rollback option.
# Same origin, so data the previous app stored in this browser (localStorage) stays available at /legacy/,
# and the Google sign-in origin of the previous app is unchanged.
#
# Build-time variables (Netlify → Site configuration → Environment variables), public by design:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   (never a secret / service_role key)
# Function variables (server only): ANTHROPIC_API_KEY (optional; without it the assistant says "not configured").

[build]
  command = "npm run build:netlify"
  publish = "dist-app"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Common security headers for everything.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# New app documents.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Previous app (rollback). Inline handlers in the legacy single-file app require 'unsafe-inline';
# user content is escaped before rendering (see legacy-core.js esc()).
[[headers]]
  for = "/legacy/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'"
    Cache-Control = "no-cache"
