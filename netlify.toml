# Production keeps serving the legacy app (now in /legacy) until the new app
# is set up and the data migration is verified. Same URL and origin, so data
# stored in the browser (localStorage / IndexedDB) remains available.
#
# NOTE: this file overrides publish settings configured in the Netlify UI.
# Nothing is deployed until this branch is merged (a human decision).

[build]
  publish = "legacy"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"
    # Inline handlers in the legacy single-file app require 'unsafe-inline'.
    # User content is escaped before rendering (see legacy-core.js esc()).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'"
